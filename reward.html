<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Verifying...</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root { --bg:#0a0a0f; --accent:#7c5cfc; --accent2:#fc5c7d; --gold:#f5c842; --green:#2ecc71; --text:#f0f0f8; --muted:#6b6b8a; }
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:'DM Sans',sans-serif; min-height:100vh;
  display:flex; align-items:center; justify-content:center; flex-direction:column; padding:24px; text-align:center; }
body::before { content:''; position:fixed; top:0; left:0; right:0; bottom:0;
  background:radial-gradient(ellipse at 50% 30%, rgba(124,92,252,0.12) 0%, transparent 60%); pointer-events:none; }
.card { background:#111118; border:1px solid #2a2a38; border-radius:24px; padding:40px 32px; max-width:360px; width:100%; position:relative; z-index:1; }
.icon { font-size:56px; margin-bottom:16px; animation:bounceIn 0.6s ease; }
@keyframes bounceIn { 0%{transform:scale(0)} 60%{transform:scale(1.2)} 100%{transform:scale(1)} }
.title { font-family:'Syne',sans-serif; font-weight:800; font-size:24px; margin-bottom:8px; }
.sub { font-size:14px; color:var(--muted); line-height:1.6; }
.earn-display { font-family:'Syne',sans-serif; font-size:42px; font-weight:800; color:var(--gold);
  text-shadow:0 0 30px rgba(245,200,66,0.4); margin:20px 0; display:none; }
.spinner { width:40px; height:40px; border:3px solid #2a2a38; border-top-color:var(--accent); border-radius:50%;
  animation:spin 0.8s linear infinite; margin:20px auto; }
@keyframes spin { to { transform:rotate(360deg); } }
.btn { display:block; width:100%; padding:16px; background:linear-gradient(135deg,var(--accent),var(--accent2));
  border:none; border-radius:14px; color:#fff; font-family:'Syne',sans-serif; font-weight:700; font-size:16px;
  cursor:pointer; margin-top:20px; text-decoration:none; transition:transform 0.2s; }
.btn:active { transform:scale(0.97); }
.error-card .icon { } 
.progress-bar { height:4px; background:#2a2a38; border-radius:999px; overflow:hidden; margin:16px 0; }
.progress-fill { height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2)); border-radius:999px;
  animation:progressAnim 2s ease forwards; }
@keyframes progressAnim { 0%{width:0%} 100%{width:100%} }
</style>
</head>
<body>
<div class="card" id="mainCard">
  <div class="icon" id="icon">⚡</div>
  <div class="title" id="title">Verifying...</div>
  <div class="sub" id="sub">Please wait while we verify your ad view</div>
  <div class="spinner" id="spinner"></div>
  <div class="progress-bar" id="progressBar" style="display:none"><div class="progress-fill"></div></div>
  <div class="earn-display" id="earnDisplay">+৳5</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, get, update, increment } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCGqA4NAwLlVuiJ3STGHVAK-NTUChVIa1g",
  authDomain: "telegram-loop-earn.firebaseapp.com",
  databaseURL: "https://telegram-loop-earn-default-rtdb.firebaseio.com",
  projectId: "telegram-loop-earn",
  storageBucket: "telegram-loop-earn.firebasestorage.app",
  messagingSenderId: "471885155168",
  appId: "1:471885155168:web:db96e8b861c4cc40d42c05"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const tg = window.Telegram?.WebApp;
tg?.expand();

const EARN = 5;
const MIN_TIME_MS = 30000; // 30 seconds minimum

const icon = document.getElementById('icon');
const title = document.getElementById('title');
const sub = document.getElementById('sub');
const spinner = document.getElementById('spinner');
const earnDisplay = document.getElementById('earnDisplay');
const progressBar = document.getElementById('progressBar');

function showError(msg) {
  icon.textContent = '❌';
  title.textContent = 'Verification Failed';
  sub.textContent = msg;
  spinner.style.display = 'none';
  const btn = document.createElement('button');
  btn.className = 'btn';
  btn.textContent = '← Go Back';
  btn.onclick = () => { window.location.href = 'index.html'; };
  document.getElementById('mainCard').appendChild(btn);
}

function showSuccess(balance) {
  icon.textContent = '🎉';
  title.textContent = 'Congratulations!';
  sub.textContent = 'You successfully watched the ad!';
  spinner.style.display = 'none';
  earnDisplay.style.display = 'block';
  earnDisplay.textContent = '+৳' + EARN;
  const btn = document.createElement('button');
  btn.className = 'btn';
  btn.textContent = '← Back to App';
  btn.onclick = () => { window.location.href = 'index.html'; };
  document.getElementById('mainCard').appendChild(btn);
  const balDiv = document.createElement('div');
  balDiv.style.cssText = 'margin-top:12px;font-size:13px;color:#6b6b8a';
  balDiv.textContent = 'New balance: ৳' + balance;
  document.getElementById('mainCard').appendChild(balDiv);
}

async function verify() {
  // Get user from Telegram or sessionStorage
  const tgUser = tg?.initDataUnsafe?.user;
  const storedUserId = sessionStorage.getItem('userId');
  const adStartTime = parseInt(sessionStorage.getItem('adStartTime') || '0');
  
  let userId = tgUser ? String(tgUser.id) : storedUserId;
  
  if (!userId) { showError('Could not identify user. Please open from Telegram.'); return; }

  // Check time elapsed
  const elapsed = Date.now() - adStartTime;
  if (adStartTime && elapsed < MIN_TIME_MS) {
    showError('You must watch the full ad before returning.');
    return;
  }

  // Check Firebase pending state
  const userRef = ref(db, `users/${userId}`);
  const snap = await get(userRef);
  if (!snap.exists()) { showError('User not found.'); return; }
  
  const user = snap.val();
  
  if (!user.adPending) { showError('No pending ad found. Please watch an ad first.'); return; }
  
  // Additional time check from Firebase
  const fbElapsed = Date.now() - (user.adStartTime || 0);
  if (fbElapsed < MIN_TIME_MS) { showError('Ad watch time too short. Please watch the full ad.'); return; }
  
  // Check daily limit
  const todayStr = new Date().toISOString().slice(0,10);
  let todayAds = user.todayAds || 0;
  if (user.todayDate !== todayStr) todayAds = 0;
  
  if (todayAds >= 200) { 
    await update(userRef, { adPending: false });
    showError('Daily ad limit reached (200/day). Come back tomorrow!'); 
    return; 
  }

  // Credit balance
  progressBar.style.display = 'block';
  const newBalance = (user.balance || 0) + EARN;
  const newTotalAds = (user.totalAds || 0) + 1;
  const newTodayAds = todayAds + 1;
  const newTotalEarned = (user.totalEarned || 0) + EARN;
  
  await update(userRef, {
    balance: newBalance,
    totalAds: newTotalAds,
    totalEarned: newTotalEarned,
    todayAds: newTodayAds,
    todayDate: todayStr,
    adPending: false,
    adStartTime: null,
    lastAdAt: Date.now()
  });

  // Track global stats
  await update(ref(db, 'stats'), {
    totalAdsWatched: increment(1),
    totalPaid: increment(EARN)
  });

  // Clear session
  sessionStorage.removeItem('adStartTime');
  sessionStorage.removeItem('userId');
  
  setTimeout(() => showSuccess(newBalance), 1000);
}

verify().catch(e => { console.error(e); showError('An error occurred. Please try again.'); });
</script>
</body>
</html>
